services:
  db:
    image: postgres:17.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: resenha
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db:/var/lib/postgresql/data

  adminer:
    image: adminer:5.4.0
    restart: always
    ports:
      - 127.0.0.1:8585:8080

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: dev
    restart: always
    volumes:
      - ./apps/api/:/app/apps/api/
    ports:
      - 127.0.0.1:3000:3000

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    restart: always
    volumes:
      - ./apps/web/:/app/apps/web/
    ports:
      - 127.0.0.1:5200:5200

volumes:
  db:
