name: CI Quality check

on:
  push:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.9.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Get Playwright installed version
        run: "echo \"PLAYWRIGHT_VERSION=$(grep -A2 '^\\s*playwright:' ./pnpm-lock.yaml | grep 'version: ' | awk '{print $2}')\" >> $GITHUB_ENV"

      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install playwright browsers
        run: pnpm --filter=web playwright:install
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run lint
        run: pnpm lint

      - name: Run prettier:check
        run: pnpm prettier:check

      - name: Run ts:check
        run: pnpm ts:check

      - name: Run apps/api tests
        run: pnpm test --filter=api

      - name: Run apps/web tests
        run: pnpm test --filter=web
